<!-- Music Player Tab -->
<div id="tab-player" class="tab-content" style="display: none;">

  <!-- Library Picker Row -->
  <div class="player-tab-library-picker">
    <div class="player-lib-picker-label">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Source Library:
    </div>
    <select id="player-library-select" class="player-lib-select" onchange="loadPlayerLibrary(this.value)">
      <option value="local">🏠 Local Storage</option>
    </select>
    <button class="btn btn-secondary btn-sm" onclick="refreshPlayerLibraryList()" title="Refresh device list" style="display:flex;align-items:center;gap:0.35rem;">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
    <div id="player-lib-status" class="player-lib-status"></div>
  </div>

  <!-- Player Content Area: Song List + Queue Panel -->
  <div class="player-tab-layout">

    <!-- Song List Panel -->
    <div class="player-songs-panel">
      <!-- Toolbar: search + play-all + shuffle-all -->
      <div class="player-songs-toolbar">
        <input type="text" id="player-search" class="search-bar" placeholder="🔍 Search title, artist, album…" oninput="filterPlayerSongs()" style="flex:1; min-width:0;">
        <button class="btn btn-sm" onclick="playerPlayAll()" title="Play all songs" style="display:flex;align-items:center;gap:0.35rem;">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Play All
        </button>
        <button class="btn btn-secondary btn-sm" onclick="playerShuffleAll()" title="Shuffle all songs" style="display:flex;align-items:center;gap:0.35rem;">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
          Shuffle
        </button>
        <span id="player-song-count" class="player-lib-status"></span>
      </div>

      <!-- Song Table -->
      <div class="player-songs-scroll">
        <table class="player-songs-table">
          <thead>
            <tr>
              <th style="width:36px;">#</th>
              <th>Title</th>
              <th class="col-hide-sm">Artist</th>
              <th class="col-hide-md">Album</th>
              <th style="width:75px;" class="col-right col-hide-sm">Bitrate</th>
              <th style="width:90px;" class="col-center">Play</th>
            </tr>
          </thead>
          <tbody id="player-songs-tbody">
            <tr><td colspan="6" class="text-muted" style="text-align:center;padding:2rem;">Select a library above to browse songs.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Queue Panel -->
    <div class="player-queue-panel" id="player-queue-panel">
      <div class="player-queue-header">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
        Play Queue
        <span id="player-queue-count" class="player-lib-status" style="margin-left:auto;"></span>
        <button class="player-ctrl-btn" onclick="clearPlayerQueue()" title="Clear queue" style="margin-left:0.5rem;font-size:0.75rem;opacity:0.6;">✕</button>
      </div>
      <div class="player-queue-list" id="player-queue-list">
        <div class="text-muted" style="padding:1.5rem 1rem;text-align:center;font-size:0.85rem;">No tracks in queue yet.</div>
      </div>
    </div>

  </div><!-- /.player-tab-layout -->
</div><!-- /#tab-player -->
