<!-- Playlists Tab -->
<div id="tab-playlists" class="tab-content" style="display: none;">
  <!-- VIEW A: Playlists Grid View -->
  <div id="playlist-grid-view" class="panel">
    <div class="panel-title" style="flex-wrap: wrap; gap: 0.75rem;">
      <span>Playlists Collection</span>
      <div class="panel-actions" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button class="btn btn-secondary" onclick="showPowerampImportModal()" id="btn-poweramp-import" title="Import Poweramp Playlists & Backup">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import Poweramp
        </button>
        <button class="btn" onclick="showCreatePlaylistModal()">+ Create Playlist</button>
      </div>
    </div>
    
    <!-- Playlists List Grid -->
    <div id="playlists-grid" class="playlists-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
      <p class="text-muted">Loading playlists...</p>
    </div>
  </div>

  <!-- VIEW B: 3-Column Playlist Dedicated Page -->
  <div id="playlist-detail-view" style="display: none; flex-direction: column; gap: 1rem;">
    <!-- Top Navigation Header -->
    <div class="panel" style="padding: 0.85rem 1.25rem; margin-bottom: 0;">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <button class="btn btn-secondary btn-sm" onclick="backToPlaylistGrid()" title="Back to All Playlists" style="display: flex; align-items: center; gap: 0.35rem;">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            All Playlists
          </button>
          <h3 id="selected-playlist-name" style="margin: 0; font-weight: 700; font-size: 1.3rem; display: flex; align-items: center; gap: 0.5rem;">Playlist Name</h3>
          <span id="selected-playlist-badge" class="badge badge-purple" style="font-size: 0.75rem;">0 tracks</span>
        </div>
        <div class="panel-actions" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button class="btn" id="btn-play-playlist" onclick="playCurrentPlaylist()">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Play
          </button>
          <button class="btn btn-secondary btn-danger" onclick="deleteCurrentPlaylist()">Delete Playlist</button>
        </div>
      </div>
    </div>

    <!-- 3-Column Layout -->
    <div class="playlist-page-grid">
      <!-- LEFT COLUMN: All Playlists Sidebar -->
      <div class="panel" style="margin-bottom: 0; padding: 1rem; max-height: calc(100vh - 280px); overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);">
          <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;">Playlists</span>
          <button class="btn btn-secondary btn-sm" onclick="showCreatePlaylistModal()" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">+ New</button>
        </div>
        <div id="playlist-sidebar-list" style="display: flex; flex-direction: column; gap: 0.35rem;">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- MIDDLE COLUMN: Current Playlist Tracks -->
      <div class="panel" style="margin-bottom: 0; padding: 1rem; max-height: calc(100vh - 280px); overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
          <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;">Playlist Songs</span>
          <span id="playlist-track-count-text" class="text-muted" style="font-size: 0.8rem;">0 songs</span>
        </div>
        <div class="table-responsive">
          <table style="width: 100%;">
            <thead>
              <tr>
                <th style="width: 40px;" class="col-center">#</th>
                <th>Track</th>
                <th style="width: 75px;" class="col-center">Duration</th>
                <th style="width: 75px;" class="col-center">Size</th>
                <th style="width: 130px;" class="col-right">Actions</th>
              </tr>
            </thead>
            <tbody id="playlist-tracks-tbody">
              <tr><td colspan="5" class="text-muted col-center">Select a playlist to view tracks.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- RIGHT COLUMN: Absent Songs for this Playlist -->
      <div class="panel" style="margin-bottom: 0; padding: 1rem; max-height: calc(100vh - 280px); overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);">
          <div style="display: flex; align-items: center; gap: 0.4rem;">
            <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;">Absent Songs</span>
            <span id="playlist-absent-count-badge" class="badge badge-red" style="font-size: 0.7rem;">0</span>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="showPowerampImportModal()" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;" title="Import Poweramp Backup">Import</button>
        </div>
        <input type="text" id="playlist-absent-search" class="search-bar" placeholder="Search absent songs..." style="width: 100%; box-sizing: border-box; font-size: 0.75rem; padding: 0.35rem 0.6rem; height: 30px; margin-bottom: 0.4rem;" oninput="filterPlaylistPageAbsentSongs()">
        <div id="playlist-absent-list" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <!-- Populated dynamically -->
          <span class="text-muted" style="font-size: 0.8rem;">No absent songs for this playlist.</span>
        </div>
      </div>
    </div>
  </div>
</div>
