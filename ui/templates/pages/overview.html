<!-- Overview Tab -->
<div id="tab-overview" class="tab-content" style="display: block;">

  <!-- Metrics Grid -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-header">
        <span>Total Local Songs</span>
        <span class="metric-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        </span>
      </div>
      <div class="metric-value" id="stat-total-songs">0</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <span>Synced Tracks</span>
        <span class="metric-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </span>
      </div>
      <div class="metric-value" id="stat-synced-count">0</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <span>Hidden Songs</span>
        <span class="metric-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </span>
      </div>
      <div class="metric-value" id="stat-hidden-count">0</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <span>Duplicates</span>
        <span class="metric-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </span>
      </div>
      <div class="metric-value" id="stat-duplicates-count">0</div>
    </div>
  </div>

  <!-- Device Breakdown Panel -->
  <div class="panel">
    <div class="panel-title">
      <span>Connected Devices & Storage Breakdown</span>
      <div class="panel-actions" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button class="btn" onclick="scanAdbDevices()">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Scan ADB Device
        </button>
        <button class="btn btn-secondary" onclick="scanIpHosts()">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"/></svg>
          Scan Over-IP Peers
        </button>
        <button class="btn btn-secondary" onclick="loadDashboardStats()">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh Stats
        </button>
      </div>
    </div>

    <!-- Device Category Filters & Quick Search Bar -->
    <div class="device-filter-bar">
      <div class="device-filter-chips">
        <span style="font-size: 0.76rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.25rem;">Filter:</span>
        <button class="filter-chip active" id="chip-filter-dev-all" onclick="setDeviceCategoryFilter('all', this)" title="Show all devices">
          All Devices <span class="chip-count-badge" id="count-dev-all">0</span>
        </button>
        <button class="filter-chip" id="chip-filter-dev-adb" onclick="setDeviceCategoryFilter('adb', this)" title="Filter ADB connected devices">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;margin-right:4px;"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>ADB Devices <span class="chip-count-badge" id="count-dev-adb">0</span>
        </button>
        <button class="filter-chip" id="chip-filter-dev-overip" onclick="setDeviceCategoryFilter('overip', this)" title="Filter Over-IP HTTP peers">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;margin-right:4px;"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"/></svg>Over-IP Peers <span class="chip-count-badge" id="count-dev-overip">0</span>
        </button>
        <button class="filter-chip" id="chip-filter-dev-local" onclick="setDeviceCategoryFilter('local', this)" title="Filter Local storage folders">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;margin-right:4px;"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>Local Storage <span class="chip-count-badge" id="count-dev-local">0</span>
        </button>
        <button class="filter-chip" id="chip-filter-dev-online" onclick="toggleDeviceOnlineFilter(this)" title="Show only online devices">
          <span style="width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 5px;"></span>Online Only
        </button>
      </div>

      <div style="position: relative; flex: 1; max-width: 300px; min-width: 180px;">
        <input type="text" id="device-search-query" class="search-bar" placeholder="Search by name, IP, model..." oninput="onDeviceSearchInput(this.value)" style="width: 100%; padding-right: 2rem; font-size: 0.82rem; height: 34px;">
        <button id="device-search-clear" onclick="clearDeviceSearch()" style="position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: none; font-size: 1.1rem; line-height: 1;" title="Clear search">×</button>
      </div>
    </div>

    <div id="device-list">
      <p class="text-muted">Loading device counts...</p>
    </div>
  </div>

  <!-- Sessions Card -->
  <div id="sessions-panel" style="background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;margin-top:16px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <h2 style="font-size:16px;font-weight:bold;color:#fff;margin:0;flex:1;letter-spacing:0.05em;">ACTIVE SESSIONS</h2>
      <button id="btn-sessions-refresh" style="background:transparent;border:1px solid #444;border-radius:6px;color:#f0c040;padding:6px 12px;cursor:pointer;font-size:12px;">Refresh</button>
    </div>
    <p id="sessions-panel-empty" style="color:#666;text-align:center;padding:16px 0;">Loading sessions...</p>
    <div id="sessions-panel-cards"></div>
  </div>

</div>
