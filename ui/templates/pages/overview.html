<!-- Overview Tab -->
<div id="tab-overview" class="tab-content" style="display: block;">
  
  <!-- Metrics Grid -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-header">
        <span>Total Local Songs</span>
        <span class="metric-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        </span>
      </div>
      <div class="metric-value" id="stat-total-songs">0</div>
      <div class="metric-desc">Across configured local music folders</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <span>Synced Tracks</span>
        <span class="metric-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </span>
      </div>
      <div class="metric-value" id="stat-synced-count">0</div>
      <div class="metric-desc">Recorded in SQLite ui/db.db</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <span>Hidden Songs</span>
        <span class="metric-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </span>
      </div>
      <div class="metric-value" id="stat-hidden-count">0</div>
      <div class="metric-desc">Files hidden from sync lists</div>
    </div>

    <div class="metric-card">
      <div class="metric-header">
        <span>Duplicates</span>
        <span class="metric-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </span>
      </div>
      <div class="metric-value" id="stat-duplicates-count">0</div>
      <div class="metric-desc">Duplicate audio files detected</div>
    </div>
  </div>

  <!-- Device Breakdown Panel -->
  <div class="panel">
    <div class="panel-title">
      <span>Connected Devices & Storage Breakdown</span>
      <div class="panel-actions" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button class="btn" onclick="scanAdbDevices()">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Scan ADB Device
        </button>
        <button class="btn btn-secondary" onclick="scanIpHosts()">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"/></svg>
          Scan Over-IP Peers
        </button>
        <button class="btn btn-secondary" onclick="loadDashboardStats()">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh Stats
        </button>
      </div>
    </div>
    <div id="device-list">
      <p class="text-muted">Loading device counts...</p>
    </div>
  </div>

</div>
